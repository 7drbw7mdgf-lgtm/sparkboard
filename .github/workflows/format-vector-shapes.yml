name: Format and test vector shapes branch
on:
  push:
    branches: [feature/shapes-vector-nodes-mobile-toolbar-2026-11-01]
permissions:
  contents: write
jobs:
  format-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write board-model.js src/icons.js src/canvas.js src/rendering.js src/commands.js src/state.js src/inspector.js src/format-panel.js src/controls.js src/tools.js src/mobile-actions.js style.css index.html tests/vector-shapes.test.js
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board-model.js src/icons.js src/canvas.js src/rendering.js src/commands.js src/state.js src/inspector.js src/format-panel.js src/controls.js src/tools.js src/mobile-actions.js style.css index.html tests/vector-shapes.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style(shapes): format vector editing and mobile UI"
            git push origin HEAD:feature/shapes-vector-nodes-mobile-toolbar-2026-11-01
          fi
      - name: Validate
        run: npm run check && npm run format:check && npm test && npm run build && npm run website:build
