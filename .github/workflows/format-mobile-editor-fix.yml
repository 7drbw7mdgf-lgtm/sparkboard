name: Format and test mobile editor fix

on:
  push:
    branches: [fix/mobile-drag-before-format-compact-sheet-2026-11-01]

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/mobile-editor-policy.js src/inspector.js src/format-panel.js src/canvas.js style.css tests/mobile-format-interactions.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mobile-editor-policy.js src/inspector.js src/format-panel.js src/canvas.js style.css tests/mobile-format-interactions.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style(mobile): normalize responsive editor changes"
            git push origin HEAD:fix/mobile-drag-before-format-compact-sheet-2026-11-01
          fi
      - run: npm run check && npm run format:check && npm test && npm run build && npm run website:build
