name: One-time source formatting repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-source-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format and commit tracked source
        shell: bash
        run: |
          npm run format
          npm run format:check
          npm run check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'All tracked files already formatted.'
            exit 0
          fi
          git commit -m 'style: apply Prettier to Sparkboard source'
          git push origin HEAD:main
      - name: Run unit tests on formatted sources
        run: npm test
