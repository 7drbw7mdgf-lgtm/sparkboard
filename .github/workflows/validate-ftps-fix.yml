name: Validate incremental Fasthosts publishing fix

on:
  push:
    branches: [fix/ftps-incremental-format-deploy-2026-11-01]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_*website.py'
