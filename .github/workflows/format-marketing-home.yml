name: Format and validate illustrated Sparkboard homepage
on:
  push:
    branches: [feature/connector-contextual-marketing-home-2026-11-01]
permissions:
  contents: write
jobs:
  format-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write index.html style.css src/controls.js src/mobile-actions.js src/mobile-editor-policy.js src/startup-screen.js tests/mobile-format-interactions.test.js tests/landing-home.test.js
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css src/controls.js src/mobile-actions.js src/mobile-editor-policy.js src/startup-screen.js tests/mobile-format-interactions.test.js tests/landing-home.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style(home): apply code formatting to marketing and connector changes"
            git push origin HEAD:feature/connector-contextual-marketing-home-2026-11-01
          fi
      - run: npm run check && npm run format:check && npm test && npm run build && npm run website:build
