name: Format context-aware inspector branch

on:
  push:
    branches: [feature/context-aware-format-panel-2026-11-01]

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feature/context-aware-format-panel-2026-11-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/format-panel.js src/inspector.js src/controls.js src/rendering.js style.css tests/format-panel.test.js
      - run: npm run check && npm test && npm run build && npm run website:build
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/format-panel.js src/inspector.js src/controls.js src/rendering.js style.css tests/format-panel.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style(format): apply repository Prettier rules"
            git push origin HEAD:feature/context-aware-format-panel-2026-11-01
          fi
