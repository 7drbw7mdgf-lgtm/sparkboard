name: Format mind-map connector feature
on:
  push:
    branches:
      - feature/touch-mindmap-master-connectors
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write app.js board-model.js style.css src/mobile-editor-policy.js src/mobile-workspace.js src/mindmap.js src/mindmap-master.js src/connector-edit.js src/canvas.js src/rendering.js src/editor.js src/mobile-actions.js src/controls.js tests/mindmap-master-connectors.test.js tests/mobile-format-interactions.test.js
      - name: Commit formatted code
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js board-model.js style.css src/mobile-editor-policy.js src/mobile-workspace.js src/mindmap.js src/mindmap-master.js src/connector-edit.js src/canvas.js src/rendering.js src/editor.js src/mobile-actions.js src/controls.js tests/mindmap-master-connectors.test.js tests/mobile-format-interactions.test.js
            git commit -m "style: format touch, mind-map and connector updates"
            git push
          fi
