name: Format startup sign-in branch

on:
  push:
    branches:
      - feature/startup-sign-in-screen-2026-11-01

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/startup-sign-in-screen-2026-11-01
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed files with repository-pinned Prettier
        run: npx --no-install prettier --write index.html src/startup-screen.js style.css tests/auth-settings.test.js
      - name: Commit formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/startup-screen.js style.css tests/auth-settings.test.js
          if ! git diff --cached --quiet; then
            git commit -m 'style(auth): format startup screen changes'
            git push origin HEAD:feature/startup-sign-in-screen-2026-11-01
          fi
