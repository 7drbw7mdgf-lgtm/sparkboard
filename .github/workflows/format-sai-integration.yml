name: Format Sai integration branch
on:
  push:
    branches: [feature/publish-sai-planner-under-site-2026-11-01]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx prettier --write scripts/build-sai.cjs scripts/build-website.cjs integration/sai/HostedPersistence.ts integration/sai/HostedAIPanel.tsx tests/sai-hosted.test.js index.html style.css
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-sai.cjs scripts/build-website.cjs integration/sai/HostedPersistence.ts integration/sai/HostedAIPanel.tsx tests/sai-hosted.test.js index.html style.css
          if ! git diff --cached --quiet; then
            git commit -m "style(sai): normalize planner integration files"
            git push origin HEAD:feature/publish-sai-planner-under-site-2026-11-01
          fi
