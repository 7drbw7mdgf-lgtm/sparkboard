name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Show canonical formatting for mobile changes
        run: |
          npx prettier --write src/mobile-gestures.js src/viewport.js style.css tests/mobile-gestures.test.js >/dev/null
          for f in src/mobile-gestures.js src/viewport.js style.css tests/mobile-gestures.test.js; do
            echo "SPARKBOARD_FORMAT_START:$f"
            cat "$f"
            echo "SPARKBOARD_FORMAT_END:$f"
          done
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run website:build
