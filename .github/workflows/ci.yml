name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*website.py'
      - run: npm run build
      - run: npm run sai:build
      - run: npm run website:build
        env:
          REQUIRE_SAI: '1'
