name: Diagnose Fasthosts file routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: fasthosts-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r deploy/requirements.txt
      - name: Compare public files over SFTP and HTTPS (read only)
        env:
          FASTHOSTS_SFTP_PASSWORD: ${{ secrets.FASTHOSTS_SFTP_PASSWORD }}
        run: python3 scripts/diagnose-hosting.py
