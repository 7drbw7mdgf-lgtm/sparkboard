name: Format and validate mobile navigation changes

on:
  push:
    branches: [fix/mobile-pan-line-pages-2026-11-01]

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/mobile-editor-policy.js src/mobile-format-pages.js src/boards.js src/tools.js src/canvas.js src/format-panel.js src/inspector.js src/controls.js style.css tests/mobile-format-interactions.test.js tests/mobile-format-pages.test.js
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mobile-editor-policy.js src/mobile-format-pages.js src/boards.js src/tools.js src/canvas.js src/format-panel.js src/inspector.js src/controls.js style.css tests/mobile-format-interactions.test.js tests/mobile-format-pages.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style(mobile): format pan-first and paged editor"
            git push origin HEAD:fix/mobile-pan-line-pages-2026-11-01
          fi
      - name: Validate
        run: npm run check && npm run format:check && npm test && npm run build && npm run website:build
